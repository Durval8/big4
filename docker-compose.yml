services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financedash}
      POSTGRES_USER: ${POSTGRES_USER:-financedash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financedash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financedash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      # Fixed cookie so the entrypoint writes it fresh with correct perms
      # (avoids the .erlang.cookie eacces failure on recreated containers).
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-big4-broker-cookie}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-financedash}
      DB_USER: ${POSTGRES_USER:-financedash}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-financedash}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Must include the public origin when served behind a real domain, or every write 403s.
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  investments-service:
    build: ./investments-service
    environment:
      MONGO_URI: mongodb://mongodb:27017/investments
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      PRICE_REFRESH_CRON: ${PRICE_REFRESH_CRON:-0 */15 * * * *}
      PRICE_FRESHNESS_WINDOW_MINUTES: ${PRICE_FRESHNESS_WINDOW_MINUTES:-14}
      NEWS_REFRESH_CRON: ${NEWS_REFRESH_CRON:-0 0 */4 * * *}
      NEWS_LOOKBACK_HOURS: ${NEWS_LOOKBACK_HOURS:-48}
      NEWS_PER_STOCK: ${NEWS_PER_STOCK:-3}
      NEWS_MAX_ITEMS: ${NEWS_MAX_ITEMS:-7}
      NEWS_WEIGHT_DECAY: ${NEWS_WEIGHT_DECAY:-0.625}
    ports:
      - "${INVESTMENTS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = relative URLs, so API calls hit whatever origin serves the page (the gateway).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
      - investments-service

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8090}:80"
    depends_on:
      - backend
      - investments-service
      - frontend

volumes:
  postgres_data:
  mongo_data:
