spring:
  application:
    name: finance-dash-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financedash}
    username: ${DB_USER:financedash}
    password: ${DB_PASSWORD:financedash}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    # Comma-separated origin patterns allowed to call /api/**. The default covers every local
    # setup (Docker gateway, test stack, Vite dev server); a deployment on a real domain MUST add
    # its public origin here or every POST/PUT/DELETE fails with 403 "Invalid CORS request" while
    # GETs keep working. See WebConfig for why. Not a wildcard on purpose — the API has no auth.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
