# Reverse proxy fronting both services and the frontend behind one origin, so the browser sees a
# single host (no CORS, no two base URLs). Per-page API partition:
#   /api/investments/*  -> investments service (holdings, pricing, summary)
#   /api/*              -> backend (transactions, budgets, balances/dashboard)
#   /*                  -> frontend (static app)
#
# resolver 127.0.0.11 + set $upstream variables force nginx to re-resolve upstream hostnames via
# Docker's embedded DNS on each request rather than once at startup. Without this, rebuilding a
# service container (new IP) causes 502s until the gateway is restarted.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Longest-prefix match wins, so investment routes are peeled off before the general /api.
    location /api/investments {
        set $investments http://investments-service:8081;
        proxy_pass $investments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend http://frontend:5173;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
